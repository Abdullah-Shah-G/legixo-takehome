<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Legixo Take-Home Q&A</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="max-w-3xl mx-auto p-6">
    <header class="mb-8">
      <h1 class="text-3xl font-bold text-gray-900">Legixo Take-Home Q&A</h1>
      <p class="text-gray-500 mt-1">Grounded Q&A over the fictional legal corpus (LangGraph + Pinecone)</p>
    </header>

    <form id="ask-form" class="flex gap-2 mb-4">
      <input id="question" type="text" placeholder="e.g. What notice period applies in the Bluecrest employment agreement?" class="flex-1 border rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" autofocus>
      <button id="ask-btn" type="submit" class="bg-blue-600 text-white px-5 py-3 rounded-lg text-sm hover:bg-blue-700 disabled:opacity-50">Ask</button>
    </form>

    <div id="loading" class="hidden text-sm text-gray-500 mb-4">Running LangGraph pipeline...</div>

    <div id="answer-box" class="hidden bg-white rounded-lg shadow p-5 mb-4"></div>

    <div id="trace-box" class="hidden bg-gray-100 rounded-lg p-4 text-xs font-mono text-gray-600 mb-4"></div>

    <div id="error-box" class="hidden bg-red-50 border border-red-200 text-red-600 rounded-lg p-4 text-sm mb-4"></div>

    <section>
      <h2 class="font-semibold text-gray-700 mb-2 text-sm">Try these</h2>
      <div class="flex flex-wrap gap-2">
        <button class="example bg-gray-200 hover:bg-gray-300 text-xs rounded-full px-3 py-1.5" data-q="What notice period applies when Bluecrest or Priya Nambiar ends the employment agreement?">Notice period</button>
        <button class="example bg-gray-200 hover:bg-gray-300 text-xs rounded-full px-3 py-1.5" data-q="How long is the non-compete after leaving Bluecrest?">Non-compete</button>
        <button class="example bg-gray-200 hover:bg-gray-300 text-xs rounded-full px-3 py-1.5" data-q="When is the next hearing in Arvind Mehta v. Northfield, and what is scheduled?">Next hearing</button>
        <button class="example bg-gray-200 hover:bg-gray-300 text-xs rounded-full px-3 py-1.5" data-q="What is the monthly rent for Unit 4B at Harbor View Tower?">Lease rent</button>
        <button class="example bg-gray-200 hover:bg-gray-300 text-xs rounded-full px-3 py-1.5" data-q="What is the population of Riverside city?">Out of corpus</button>
      </div>
    </section>
  </div>

  <script>
    const form = document.getElementById("ask-form");
    const input = document.getElementById("question");
    const btn = document.getElementById("ask-btn");
    const loading = document.getElementById("loading");
    const answerBox = document.getElementById("answer-box");
    const traceBox = document.getElementById("trace-box");
    const errorBox = document.getElementById("error-box");

    function esc(s) {
      const div = document.createElement("div");
      div.textContent = s;
      return div.innerHTML;
    }

    async function ask(q) {
      errorBox.classList.add("hidden");
      loading.classList.remove("hidden");
      btn.disabled = true;
      try {
        const res = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: q }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Request failed");

        answerBox.classList.remove("hidden");
        answerBox.innerHTML = `
          <div class="text-sm text-gray-500 mb-1">Answer</div>
          <div class="whitespace-pre-wrap"><strong>${esc(data.answer)}</strong></div>
          ${data.citations && data.citations.length ? `
            <div class="text-xs text-gray-400 mt-3 mb-1">Citations</div>
            <ul class="text-xs text-gray-600 space-y-1">${
              data.citations.map(c => `<li><code class="bg-gray-100 px-1 rounded">${esc(c.source_file)}</code></li>`).join("")
            }</ul>` : ""}
          ${data.grounded ? "" : '<div class="text-xs text-amber-600 mt-2">No grounded answer — question appears out of corpus.</div>'}
        `;
        traceBox.classList.remove("hidden");
        traceBox.textContent = "Trace · steps: " + data.steps + "\n" + (data.trace || []).join("\n");
      } catch (e) {
        errorBox.classList.remove("hidden");
        errorBox.textContent = "Error: " + e.message;
      }
      loading.classList.add("hidden");
      btn.disabled = false;
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      if (input.value.trim()) ask(input.value.trim());
    });
    document.querySelectorAll(".example").forEach((b) => {
      b.addEventListener("click", () => {
        input.value = b.dataset.q;
        ask(b.dataset.q);
      });
    });
  </script>
</body>
</html>
